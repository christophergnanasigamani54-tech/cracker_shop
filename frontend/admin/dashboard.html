<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - பட்டாசு கடை</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎆</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/admin.css">
<link rel="stylesheet" href="/css/theme.css">
</head>
<body>
<div id="login" hidden>
  <canvas id="sky"></canvas>
  <section class="lbox">
    <div class="big">🎆</div>
    <h1 data-i18n="loginTitle"></h1>
    <p data-i18n="loginSub"></p>
    <p class="settings-hint" data-i18n="loginHint"></p>
    <form id="loginForm">
      <label for="loginEmail" data-i18n="loginEmail"></label>
      <input id="loginEmail" name="email" type="email" maxlength="254" autocomplete="username" required>
      <label for="pw" data-i18n="pwLabel"></label>
      <div class="password-field">
        <input type="password" id="pw" data-i18n-ph="pwPh" data-i18n-aria="pwPh" placeholder="" autocomplete="current-password" required>
        <button class="password-toggle" type="button" data-password-toggle data-i18n-aria="showPassword" aria-pressed="false"></button>
      </div>
      <div class="err" id="loginErr" role="alert"></div>
      <button class="btn pri" style="width:100%;padding:12px" type="submit" data-i18n="loginBtn"></button>
      <button class="auth-link" id="forgotPasswordLink" type="button" data-i18n="forgotPassword"></button>
    </form>
    <form id="forgotPasswordForm" hidden>
      <h2 data-i18n="forgotTitle"></h2>
      <p data-i18n="forgotHint"></p>
      <label for="forgotEmail" data-i18n="forgotEmail"></label>
      <input id="forgotEmail" type="email" autocomplete="email" required>
      <div class="err" id="forgotPasswordError" role="alert"></div>
      <div class="auth-message" id="forgotPasswordMessage" role="status" hidden></div>
      <button class="btn pri" style="width:100%;padding:12px" type="submit" data-i18n="sendResetLink"></button>
      <button class="auth-link" id="backToLogin" type="button" data-i18n="backToLogin"></button>
    </form>
    <form id="resetPasswordForm" hidden>
      <h2 data-i18n="resetPasswordTitle"></h2>
      <label for="resetPassword" data-i18n="resetPasswordLabel"></label>
      <div class="password-field">
        <input id="resetPassword" type="password" minlength="6" maxlength="100" autocomplete="new-password" required>
        <button class="password-toggle" type="button" data-password-toggle data-i18n-aria="showPassword" aria-pressed="false"></button>
      </div>
      <label for="resetPasswordConfirm" data-i18n="resetConfirmLabel"></label>
      <div class="password-field">
        <input id="resetPasswordConfirm" type="password" minlength="6" maxlength="100" autocomplete="new-password" required>
        <button class="password-toggle" type="button" data-password-toggle data-i18n-aria="showPassword" aria-pressed="false"></button>
      </div>
      <div class="err" id="resetPasswordError" role="alert"></div>
      <button class="btn pri" style="width:100%;padding:12px" type="submit" data-i18n="resetPasswordBtn"></button>
      <button class="auth-link" id="resetBackToLogin" type="button" data-i18n="backToLogin"></button>
    </form>
    <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="ta">தமிழ்</button><button type="button" data-lang="en">EN</button></div>
  </section>
</div>

<div id="app" hidden>
  <nav class="side">
    <div class="brand"><span class="side-mark"><span id="sideLogoFallback">🎆</span><img id="sideLogo" alt="" hidden></span><div id="sideName">கடை</div></div>
    <button class="tab on" data-t="dash" data-i18n="navDash"></button>
    <button class="tab" data-t="pos" data-i18n="navPos"></button>
    <button class="tab" data-t="orders"><span data-i18n="navOrders"></span> <span class="badge" id="newBadge" hidden></span></button>
    <button class="tab" data-t="bills" data-i18n="navBills"></button>
    <button class="tab" data-t="products" data-i18n="navProducts"></button>
    <button class="tab" data-t="settings" data-i18n="navSettings"></button>
    <div class="side-footer">
      <div class="side-session"><span class="session-dot"></span><span data-i18n="sessionActive"></span></div>
    <div class="lang side-lang" role="group" aria-label="Language"><button type="button" data-lang="ta">தமிழ்</button><button type="button" data-lang="en">EN</button></div>
    <a href="/" target="_blank" data-i18n="navSite"></a>
    <button class="lo" id="logout" data-i18n="navLogout"></button>
    </div>
  </nav>
  <div class="workspace">
    <header class="workspace-head">
      <div><span class="workspace-eyebrow" data-i18n="workspaceLabel"></span><strong id="workspaceName">Shop owner</strong></div>
      <div class="workspace-tools"><span class="session-status"><i></i><span data-i18n="sessionActive"></span></span></div>
    </header>
    <main id="view"></main>
  </div>
</div>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div id="receipt"></div>

<script src="/js/common.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/admin-i18n.js"></script>
<script src="/js/fireworks.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
